<!doctype html>
<!--
	The image shown when the site is shared, src/lib/assets/og.png: the page at dusk, distilled.
	Render it again after changing this file, with Chrome:

	"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
		--force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=2000 \
		--screenshot=src/lib/assets/og.png scripts/og.html
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Newsreader';
				font-weight: 200 800;
				src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2');
			}

			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				position: relative;
				/* The dusk sky of src/lib/sky.ts, and the evening coming on low over the sea */
				background:
					radial-gradient(60% 45% at 78% 74%, rgb(255 178 112 / 0.55), transparent),
					linear-gradient(rgb(38 40 98), rgb(92 62 118) 42%, rgb(244 140 82) 82%, rgb(196 104 86));
				color: #f3f4f7;
				font-family: 'Newsreader', Georgia, serif;
				-webkit-font-smoothing: antialiased;
			}

			/* The still the page shows before three.js has drawn the scene, larger, so the bridge
			   runs off both sides */
			.bridge {
				position: absolute;
				left: -230px;
				bottom: -112px;
				width: 1600px;
			}

			/* The sea in shade beneath the bridge, so its lights carry */
			.shade {
				position: absolute;
				inset: auto 0 0 0;
				height: 200px;
				background: linear-gradient(transparent, rgb(26 20 56 / 0.55));
			}

			header {
				position: absolute;
				top: 58px;
				left: 72px;
			}

			h1 {
				margin: 0;
				font-weight: 600;
				font-size: 96px;
				line-height: 1;
				letter-spacing: -0.012em;
				white-space: nowrap;
			}

			p {
				margin: 22px 0 0;
				font-weight: 450;
				font-size: 36px;
				line-height: 1.2;
				color: rgb(243 244 247 / 0.82);
			}

			/* Underlined as the link on the page is */
			.link {
				color: #f3f4f7;
				text-decoration: underline 1.5px;
				text-underline-offset: 0.18em;
			}

			/* The page's waving flag, caught mid-wave: the same strips, each turned a little
			   further along the ripple than the one before */
			.flag {
				--width: 1.3em;
				display: inline-flex;
				width: var(--width);
				height: 0.65em;
				margin-left: 0.2em;
				perspective: 1.5em;
				vertical-align: -0.02em;
				filter: drop-shadow(0 0.04em 0.06em rgb(26 20 56 / 0.5));
			}

			.strip {
				flex: 1;
				margin-right: -1px;
				background: url('../src/lib/assets/penang-flag.svg') calc(var(--i) * var(--width) / -24) 0 /
					var(--width) 100% no-repeat;
				transform-origin: left center;
				--phase: sin(var(--i) * 0.18rad - 0.6rad);
				transform: translateY(calc(var(--phase) * 0.03em)) rotateY(calc(var(--phase) * 14deg));
			}
		</style>
	</head>
	<body>
		<img class="bridge" src="../src/lib/assets/bridge/dusk.webp" alt="" />
		<div class="shade"></div>
		<header>
			<h1>
				Every Penang holiday<span class="flag"
					><span class="strip" style="--i: 0"></span><span class="strip" style="--i: 1"></span
					><span class="strip" style="--i: 2"></span><span class="strip" style="--i: 3"></span
					><span class="strip" style="--i: 4"></span><span class="strip" style="--i: 5"></span
					><span class="strip" style="--i: 6"></span><span class="strip" style="--i: 7"></span
					><span class="strip" style="--i: 8"></span><span class="strip" style="--i: 9"></span
					><span class="strip" style="--i: 10"></span><span class="strip" style="--i: 11"></span
					><span class="strip" style="--i: 12"></span><span class="strip" style="--i: 13"></span
					><span class="strip" style="--i: 14"></span><span class="strip" style="--i: 15"></span
					><span class="strip" style="--i: 16"></span><span class="strip" style="--i: 17"></span
					><span class="strip" style="--i: 18"></span><span class="strip" style="--i: 19"></span
					><span class="strip" style="--i: 20"></span><span class="strip" style="--i: 21"></span
					><span class="strip" style="--i: 22"></span><span class="strip" style="--i: 23"></span
				></span>
			</h1>
			<p>Sourced from <span class="link">penang.gov.my</span>.</p>
		</header>
	</body>
</html>
