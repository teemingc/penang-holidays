<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="rgb(5 8 20)" />
		<script>
			// Colour the page for the time of day in Penang before it's first painted. This is a
			// rough copy of the sun's position in src/lib/sky.ts, which keeps it up to date after
			{
				// A ?time=21:30 query previews another time of day, as src/lib/sky.ts does
				const time = new URL(location.href).searchParams.get('time')?.match(/^(\d{1,2}):(\d{2})$/);
				const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kuala_Lumpur' });
				const now = time
					? new Date(`${today}T${time[1].padStart(2, '0')}:${time[2]}:00+08:00`)
					: new Date();
				const rad = Math.PI / 180;
				const day = (now - Date.UTC(now.getUTCFullYear(), 0, 0)) / 864e5;
				const dec = -23.44 * rad * Math.cos(((2 * Math.PI) / 365) * (day + 10));
				const h = (now.getUTCHours() + now.getUTCMinutes() / 60 + 100.33 / 15 - 12) * 15 * rad;
				const lat = 5.41 * rad;
				const e = Math.asin(
					Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(h)
				);
				// Before noon the sun is still climbing, whichever side of a day in UTC it is
				const morning = Math.sin(h) < 0;
				document.documentElement.dataset.sky =
					e < -6 * rad ? 'night' : e < 6 * rad ? (morning ? 'dawn' : 'dusk') : 'day';
				// The sky itself, blended across twilight as paletteAt does: the top and horizon of
				// each of src/lib/sky.ts's palettes
				const sky = {
					night: [
						[5, 8, 20],
						[22, 32, 66]
					],
					dawn: [
						[52, 66, 128],
						[246, 172, 150]
					],
					day: [
						[92, 160, 226],
						[206, 230, 246]
					],
					dusk: [
						[38, 40, 98],
						[244, 140, 82]
					]
				};
				const twilight = morning ? sky.dawn : sky.dusk;
				const [from, to, t] =
					e < -8 * rad
						? [sky.night, sky.night, 0]
						: e < 0
							? [sky.night, twilight, (e + 8 * rad) / (8 * rad)]
							: e < 10 * rad
								? [twilight, sky.day, e / (10 * rad)]
								: [sky.day, sky.day, 0];
				const [top] = ['--top', '--horizon'].map((name, i) => {
					const mixed = from[i].map((c, k) => Math.round(c + (to[i][k] - c) * t));
					const colour = `rgb(${mixed.join(' ')})`;
					document.documentElement.style.setProperty(name, colour);
					return colour;
				});
				// Browsers that tint their own bars to the page take it from here
				document.querySelector('meta[name="theme-color"]').content = top;
			}
		</script>
		<style>
			/* The sky, painted from the first frame rather than once the stylesheets arrive, so the
			   page never flashes white. +page.svelte's own styles take over from here */
			:root {
				color-scheme: dark;
			}
			:root[data-sky='day'] {
				color-scheme: light;
			}
			/* Safari on iOS colours the bars at the edges of the screen from the page's solid
			   background colour, not its gradient, so it's the sky at the top */
			:root {
				background-color: var(--top, rgb(5 8 20));
			}
			body {
				margin: 0;
				min-height: 100dvh;
				background: linear-gradient(var(--top, rgb(5 8 20)), var(--horizon, rgb(22 32 66))) fixed
					var(--top, rgb(5 8 20));
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
