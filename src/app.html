<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#050814" />
		<script>
			// Colour the sky for the time of day in Penang before it's first painted. This is a
			// rough copy of the sun's position in src/lib/sky.ts, which keeps it up to date after
			{
				// A ?time=21:30 query previews another time of day, as src/lib/sky.ts does
				const time = new URL(location.href).searchParams.get('time')?.match(/^(\d{1,2}):(\d{2})$/);
				const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kuala_Lumpur' });
				const now = time
					? new Date(`${today}T${time[1].padStart(2, '0')}:${time[2]}:00+08:00`)
					: new Date();
				// The holidays gone by this year are hidden from the first paint, until they're asked
				// for: every day before today, as whole months and then days of this one. See the
				// almanac in src/routes/+page.svelte
				{
					const [year, month, date] = today.split('-');
					const gone = [];
					const two = (n) => String(n).padStart(2, '0');
					for (let m = 1; m < +month; m++) gone.push(`[data-date^="${year}-${two(m)}"]`);
					for (let d = 1; d < +date; d++) gone.push(`[data-date="${year}-${month}-${two(d)}"]`);
					if (gone.length) {
						const past = `:is(${gone.join()})`;
						// The fold tallies them, in whichever of its counts ends at the last one gone by
						const nextPast = past.replaceAll('data-date', 'data-next');
						const style = document.createElement('style');
						style.textContent = `
							.months:not(.all) li${past},
							.months:not(.all) .month:not(:has(li:not(${past}))) { display: none }
							.almanac:has(.months:not(.all)):not(:has(li:not(${past}))) .over { display: block }
							.fold:has(.tally${past}), .tally${past}:not(${nextPast}) { display: block }
						`;
						document.head.append(style);
					}
				}
				const rad = Math.PI / 180;
				const day = (now - Date.UTC(now.getUTCFullYear(), 0, 0)) / 864e5;
				const dec = -23.44 * rad * Math.cos(((2 * Math.PI) / 365) * (day + 10));
				const b = ((2 * Math.PI) / 365) * (day - 81);
				const equation = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
				const h =
					(now.getUTCHours() + now.getUTCMinutes() / 60 + 100.33 / 15 + equation / 60 - 12) *
					15 *
					rad;
				const lat = 5.41 * rad;
				const e = Math.asin(
					Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(h)
				);
				// Before noon the sun is still climbing, whichever side of a day in UTC it is
				const morning = Math.sin(h) < 0;
				const phase = e < -6 * rad ? 'night' : e < 10 * rad ? (morning ? 'dawn' : 'dusk') : 'day';
				document.documentElement.dataset.sky = phase;
				// The sky itself, blended across twilight as paletteAt does: the top, horizon, mid and
				// sea of each of src/lib/sky.ts's palettes
				const sky = {
					night: [
						[5, 8, 20],
						[22, 32, 66],
						[12, 18, 44],
						[3, 8, 20]
					],
					dawn: [
						[52, 66, 128],
						[252, 186, 138],
						[178, 120, 166],
						[20, 40, 70]
					],
					day: [
						[92, 160, 226],
						[206, 230, 246],
						[150, 198, 240],
						[14, 96, 150]
					],
					dusk: [
						[38, 40, 98],
						[252, 148, 66],
						[172, 82, 138],
						[24, 30, 60]
					]
				};
				const twilight = morning ? sky.dawn : sky.dusk;
				const [from, to, t] =
					e < -8 * rad
						? [sky.night, sky.night, 0]
						: e < 0
							? [sky.night, twilight, (e + 8 * rad) / (8 * rad)]
							: e < 14 * rad
								? [twilight, sky.day, e / (14 * rad)]
								: [sky.day, sky.day, 0];
				// The type, light or dark, never too faint to read against the top of the sky:
				// keep in sync with inksFor in src/lib/sky.ts
				const inks = (top) => {
					const luminance = (colour) => {
						const [r, g, b] = colour.map((c) => {
							const v = c / 255;
							return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
						});
						return 0.2126 * r + 0.7152 * g + 0.0722 * b;
					};
					const contrast = (a, b) => {
						const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p);
						return (x + 0.05) / (y + 0.05);
					};
					const mix = (a, b, t) => a.map((c, k) => c + (b[k] - c) * t);
					const light = [244, 248, 251];
					const darkInk = [6, 20, 42];
					const dark = contrast(darkInk, top) > contrast(light, top);
					let ink = dark ? darkInk : light;
					const purest = dark ? [0, 0, 0] : [255, 255, 255];
					for (let i = 0; i < 10 && contrast(ink, top) < 4.5; i++) ink = mix(ink, purest, 0.25);
					const legible = (colour, strength) => {
						for (let s = strength; s < 1; s += 0.02) {
							const blended = mix(top, colour, s);
							if (contrast(blended, top) >= 4.5) return blended;
						}
						return colour;
					};
					let accent = dark ? [6, 63, 115] : [246, 207, 79];
					for (let i = 0; i < 30 && contrast(accent, top) < 4.5; i++)
						accent = mix(accent, ink, 0.1);
					if (contrast(accent, top) < 4.5) accent = ink;
					const root = document.documentElement;
					root.dataset.ink = dark ? 'dark' : 'light';
					const css = (c) => `rgb(${c.map(Math.round).join(' ')})`;
					root.style.setProperty('--ink', css(ink));
					root.style.setProperty('--ink-soft', css(legible(ink, 0.74)));
					root.style.setProperty('--ink-faint', css(legible(ink, 0.54)));
					root.style.setProperty('--accent', css(accent));
				};
				const mix = (a, b, t) => a.map((c, k) => c + (b[k] - c) * t);
				// keep in sync with shade in src/lib/sky.ts
				const step = (from, to, x) => {
					const t = Math.min(1, Math.max(0, (x - from) / (to - from)));
					return t * t * (3 - 2 * t);
				};
				const shade = 0.68 * step(-10 * rad, -6 * rad, e) * (1 - step(2 * rad, 6 * rad, e));
				const [top, horizon, mid, sea] = from.map((colour, i) => mix(colour, to[i], t));
				const shaded = [top, horizon].map((colour) => mix(colour, [26, 20, 56], shade));
				['--top', '--horizon'].forEach((name, i) => {
					const colour = `rgb(${shaded[i].map(Math.round).join(' ')})`;
					document.documentElement.style.setProperty(name, colour);
					// The top of the sky is the colour at every edge of the screen, and of the
					// browser's bars
					if (i === 0) {
						document.querySelector('meta[name="theme-color"]').content = colour;
						inks(shaded[i].map(Math.round));
					}
				});

				// The sky down the whole page, in its background: from the top of the sky through the
				// band above the horizon to the horizon itself, brightest there, then the water, on
				// down to the foot of the page, where it thins into the page's own colour. The
				// horizon is where the scene's camera puts it, a sixth of the way down the bridge's
				// frame, or with the camera stepped back for a tall one, a little under a third.
				// src/routes/+page.svelte paints with this too, in src/lib/sky.ts's colours, once
				// it's keeping the sky up to date
				window.paintSky = (top, mid, horizon, deep, elevation) => {
					const pane = document.querySelector('.sky');
					const frame = document.querySelector('.plate')?.getBoundingClientRect();
					if (!pane || !frame) return;
					const start = pane.getBoundingClientRect().top + scrollY;
					const end = document.body.getBoundingClientRect().bottom + scrollY;
					const scene = frame.height;
					const line = frame.top + scrollY + scene * (frame.width / scene < 1 ? 0.291 : 0.169);
					// Fainter after dark, and never white
					const dark = Math.min(1, Math.max(0, -elevation / (8 * rad)));
					const glowing = 1 - 0.8 * dark;
					const glow = mix(horizon, [255, 255, 255], 0.4 * glowing ** 2);
					const at = (colour, y, alpha = 1) =>
						`rgb(${colour.map(Math.round).join(' ')} / ${alpha}) ${Math.round(y)}px`;
					const above = scene * 0.3;
					const below = scene * 0.4;
					document.documentElement.style.backgroundImage = [
						`linear-gradient(${[
							at(glow, line - above * 1.6, 0),
							at(glow, line - above * 0.7, 0.85 * glowing * 0.6),
							at(glow, line, 0.85 * glowing),
							at(glow, line + below * 0.7, 0.85 * glowing * 0.6),
							at(glow, line + below * 1.6, 0)
						].join(', ')})`,
						`linear-gradient(${[
							at(top, start),
							at(mix(top, mid, 0.5), start + (line - start) * 0.3),
							at(mid, start + (line - start) * 0.55),
							at(mix(mid, horizon, 0.5), start + (line - start) * 0.78),
							at(horizon, line),
							at(deep, line + scene * 0.9),
							at(deep, end - 208),
							at(top, end - 48)
						].join(', ')})`
					].join(', ');
				};
				// The water; keep in sync with waterOf in src/lib/sky.ts
				const deep = mix(mix(sea, mid, 0.3), horizon, 0.65 * step(2 * rad, 10 * rad, e));
				// Painted from the first frame, by the script at the end of the body, and again
				// whenever the page changes size, as its fonts arrive: until the page's own scripts
				// have loaded, which can be a long while on a slow connection, and take over
				window.skyWatch = new ResizeObserver(() => paintSky(shaded[0], mid, horizon, deep, e));
			}
		</script>
		<style>
			/* The top of the sky, painted from the first frame rather than once the stylesheets
			   arrive, so the page never flashes white. It's the one colour at every edge of the
			   screen, so whatever a browser fills its bars or the sides of a folding phone with,
			   it matches.
			   +page.svelte's own styles take over from here */
			:root {
				color-scheme: dark;
				background: var(--top, #050814);
			}
			body {
				margin: 0;
				min-height: 100dvh;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// The sky is painted once the page it's measured against has been parsed, and the
			// stylesheets that lay it out have loaded, which a script waits for: before the first
			// frame, rather than when the page's own scripts arrive
			skyWatch.observe(document.body);
		</script>
	</body>
</html>
