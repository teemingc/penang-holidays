<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#050814" />
		<!-- The sky for the time of day in Penang, coloured before it's first painted: src/lib/boot.ts,
		     bundled by vite.config.ts and put here by src/hooks.server.ts -->
		<script>
			%boot%
		</script>
		<style>
			/* The top of the sky, painted from the first frame rather than once the stylesheets
			   arrive, so the page never flashes white. It's the one colour at every edge of the
			   screen, so whatever a browser fills its bars or the sides of a folding phone with,
			   it matches.
			   +page.svelte's own styles take over from here */
			:root {
				color-scheme: dark;
				background: var(--top, #050814);
			}
			body {
				margin: 0;
				min-height: 100dvh;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// The sky is painted once the page it's measured against has been parsed, and the
			// stylesheets that lay it out have loaded, which a script waits for: before the first
			// frame, rather than when the page's own scripts arrive
			skyWatch.observe(document.body);
		</script>
	</body>
</html>
