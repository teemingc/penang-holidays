name: Deploy

on:
  push:
    branches: [main]
    paths: [src/**, data/**, wrangler.jsonc, package.json, pnpm-lock.yaml]
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Skipping deploy because the CLOUDFLARE_API_TOKEN secret is not set"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v5
        with:
          # Pick up the commit the scrape job just pushed
          ref: main
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: pnpm/action-setup@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run deploy
