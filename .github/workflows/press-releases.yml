name: School holiday press releases

# The ministry adds days off school after its calendar is out, most years one before Hari Raya
# Aidilfitri, and says so in a press release rather than in the calendar. This reads its new
# press releases and opens a pull request with the days they add for schools in Penang.
# A release it can't be sure of fails the run, for someone to read.

on:
  workflow_dispatch:
  schedule:
    # Every day at 9am in Malaysia
    - cron: '0 1 * * *'

# Nothing, but for the one job that opens the pull request
permissions: {}

concurrency:
  group: press-releases

env:
  BRANCH: school-holiday-press-releases

jobs:
  press-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The token isn't left in the checkout, so nothing that runs before the last step has it:
      # not a dependency's install script, nor the code that reads what the ministry's site sends
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/press-releases.ts "$RUNNER_TEMP/pull-request.md"
      - run: pnpm test
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- scripts data; then
            echo "No new days off school"
            exit 0
          fi

          # git pushes with the token from here on
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add scripts data
          git commit -m 'Add the days off school from a ministry press release'
          # the branch is this workflow's own, made again from main on every run
          git push --force origin "$BRANCH"

          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = 'OPEN' ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pull-request.md"
          else
            gh pr create --head "$BRANCH" --base main \
              --title 'Add the days off school from a ministry press release' \
              --body-file "$RUNNER_TEMP/pull-request.md"
          fi
