name: Scrape

on:
  workflow_dispatch:
    inputs:
      years:
        description: Years to scrape, separated by spaces (leave empty for every year on the portal)
        required: false
        type: string
  schedule:
    # Once a year on 1 December, when the next year's holidays are usually gazetted
    - cron: '0 1 1 12 *'

# Nothing, but for the one job that pushes the data
permissions: {}

concurrency:
  group: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The token isn't left in the checkout, so nothing that runs before the last step has it:
      # not a dependency's install script, nor the code that reads what the sources send
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scrape $YEARS
        env:
          YEARS: ${{ inputs.years }}
      - run: pnpm test
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard -- data)" ]; then
            echo "No changes"
            exit 0
          fi
          # git pushes with the token from here on
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "Update holidays: $(git diff --cached --name-only -- 'data/[0-9]*.json' | xargs -n1 basename | sed 's/.json//' | paste -sd, -)"
          git push
